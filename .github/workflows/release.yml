name: Release
on:
  push:
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete existing release
        run: gh release delete "${GITHUB_REF_NAME}" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: 星控 ${{ github.ref_name }}
          body: |
            星控（Xingkong）${{ github.ref_name }}

            Android 专业级性能监视工具，App + Daemon 双组件运行。

            ## 功能
            - 实时性能：CPU / 内存 / GPU / 温度 / 电池 / 功率
            - 悬浮窗监视器 + FPS 记录 + 快捷磁贴
            - 历史会话与详情统计（最大/最小/平均/1% Low/5% Low）

            ## 下载
            - **Xingkong_${{ github.ref_name }}.apk**：主 App（已内置 GPU 频率 Helper）
            - 全部功能免费开放；完全离线运行，无任何云端上报

            ## 安装
            1. 安装主 App
            2. 首次引导：Root 启动 或 复制 Shell 命令到 ADB Shell 执行启动 Daemon
            3. 需要 GPU 频率时：设置 → 启动 → 安装 Helper（一键导出 + ADB 安装）
          files: release/Xingkong_*.apk
          fail_on_unmatched_files: true
          prerelease: false
