name: Release

# tag v* 触发：构建 app + helper 双 APK，挂 GitHub Release
# 公益版：无会员/支付/统计；完全离线
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble app debuggable-release
        run: |
          chmod +x gradlew
          bash gradlew :app:assembleRelease :helper:assembleRelease --no-daemon

      - name: Copy APKs
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/*.apk release-apk/ || true
          cp helper/build/outputs/apk/release/*.apk release-apk/ || true
          # 若 release 未签名产物名为 *-unsigned.apk，统一改名
          ls -la release-apk/
          for f in release-apk/*-unsigned.apk; do
            [ -e "$f" ] || continue
            mv "$f" "${f/-unsigned.apk/.apk}"
          done
          ls -la release-apk/

      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          name: 星控 v${{ github.ref_name }}
          body: |
            星控（Xingkong）v${{ github.ref_name }}

            Android 专业级性能监视工具，App + Daemon 双组件运行。用于查看设备性能状态、管理悬浮窗监视器、记录帧率相关会话数据。

            ## 本版本要点
            - 性能监视：CPU / 内存 / GPU / 温度 / 电池 实时指标
            - 悬浮窗监视器：实时数据胶囊，可选字段，不可用时显示 --
            - FPS 记录：开始/停止/计时，历史记录与详情统计（最大/最小/平均/1% Low/5% Low）
            - 快捷磁贴：下拉通知栏快捷开始/停止 FPS 记录
            - 全部功能免费开放，不收取任何费用

            ## 下载说明
            - **Xingkong_v${{ github.ref_name }}.apk**：主 App
            - **Xingkong_Helper_v${{ github.ref_name }}.apk**：GPU 频率采样 Helper（可选，提升 GPU 指标可用性；由 App 内引导通过 ADB 安装）
            - 全部功能免费开放；本应用完全离线运行，无任何云端上报。

            ## 安装
            1. 安装主 App。
            2. 首次引导中选择「Root 启动」或复制「Shell 命令」到 ADB Shell 执行，以启动 Daemon。
            3. 需要 GPU 频率指标时，按 App 内指引安装 Helper。
          files: |
            release-apk/*.apk
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
